<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Apex Digital Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <header class="bg-slate-950/80 border-b border-slate-800 px-6 py-4 flex justify-between items-center max-w-7xl mx-auto">
        <a href="index.html" class="text-xl font-bold text-white">APEX <span class="text-cyan-400">STUDIO</span></a>
        <nav class="flex gap-6 text-sm">
            <a href="index.html" class="text-slate-400 hover:text-white">Home</a>
            <a href="services.html" class="text-slate-400 hover:text-white">Services</a>
            <a href="contact.html" class="text-cyan-400 font-semibold">Contact</a>
        </nav>
    </header>

    <section class="max-w-xl mx-auto px-6 py-16">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
            <h1 class="text-2xl font-bold text-white mb-2 text-center">Start Your Project With Us</h1>
            <p class="text-slate-400 text-xs text-center mb-8">Fill in the details below to send us your requirements directly via WhatsApp.</p>

            <form id="contactForm" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Your Name</label>
                    <input type="text" id="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400" placeholder="e.g. John Doe / Syed">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Business Name & Type</label>
                    <input type="text" id="business" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400" placeholder="e.g. Cafe / Clothing Brand">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Required Service</label>
                    <select id="service" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                        <option>WhatsApp Food Store Setup</option>
                        <option>Full E-Commerce Web Store</option>
                        <option>Custom Corporate / Agency Website</option>
                    </select>
                </div>
                <button type="button" onclick="sendInquiry()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-500 hover:opacity-90 text-white font-bold text-sm py-3.5 rounded-xl transition shadow-lg mt-4">
                    Send Inquiry on WhatsApp
                </button>
            </form>
        </div>
    </section>

    <script>
        function sendInquiry() {
            const name = document.getElementById('name').value;
            const business = document.getElementById('business').value;
            const service = document.getElementById('service').value;

            if(!name || !business) {
                alert("Please fill out all fields!");
                return;
            }

            const phone = "923460804014"; 
            const msg = `Hello Apex Studio! 👋%0A%0AI want to start a project:%0A👤 *Name:* ${name}%0A🏢 *Business:* ${business}%0A🛠️ *Required Service:* ${service}`;
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
